events {}

http {
    # Use Docker's embedded DNS so service names are re-resolved
    # when containers are recreated with new IPs.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    server_tokens off;
    client_max_body_size 256k;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    # Do not log query strings (they carry bearer tokens for /coop and /docrender).
    log_format lamort '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log lamort;

    server {
        listen 8000;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        limit_req zone=general burst=40 nodelay;

        # Brute-force protection on credential endpoints.
        location ~ ^/Account/(Login|Register)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass $lamort_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        set $lamort_coop http://lamort-coop:8080;
        set $lamort_docrender http://lamort-docrender:8080;
        set $lamort_web http://lamort-web:8080;

        location = /docrender/health {
            proxy_pass $lamort_docrender/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /coop {
            return 302 /coop/;
        }

        location /coop/ {
            rewrite ^/coop/(.*)$ /$1 break;
            proxy_pass $lamort_coop;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docrender/api/ {
            rewrite ^/docrender/api/(.*)$ /api/$1 break;
            proxy_pass $lamort_docrender;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            proxy_pass $lamort_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
